<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0F1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kana">
<link rel="apple-touch-icon" href="icon.png">
<title>Kana</title>
<style>
:root{
  --bg:#0B0F1C;--panel:#141A2E;--panel2:#1B2340;--line:#252E4C;
  --ink:#EEF0FF;--dim:#858BAF;
  --neon:#9B5CFF;--neon2:#FF4FD8;--cyan:#4DE8FF;
  --ok:#3DFFB0;--ko:#FF4D6D;--gold:#FFD166;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.kana{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

/* ---------- header ---------- */
.hd{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;min-height:56px}
.hd h1{font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em}
.hd h1 small{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:1px}
.ic{width:40px;height:40px;flex:none;border-radius:13px;background:var(--panel);display:grid;place-items:center;font-size:17px;transition:transform .1s,background .15s}
.ic:active{transform:scale(.92)}
.bar{height:3px;margin:0 14px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--neon2));transition:width .35s cubic-bezier(.2,.9,.3,1)}
.sub{display:flex;justify-content:space-between;align-items:center;padding:7px 16px;font-size:12.5px;color:var(--dim);min-height:32px}
.sub b{color:var(--ink);font-weight:600}
.streak{color:var(--gold)}
.flag{display:inline-block;padding:2px 7px;border-radius:999px;background:var(--panel2);font-size:10.5px;margin-left:5px;color:var(--neon2);vertical-align:middle}

/* ---------- pages ---------- */
.page{flex:1;display:flex;flex-direction:column;min-height:0;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 20px}

/* ---------- home ---------- */
.hero{padding:22px 16px 16px}
.hero .jp{font-size:40px;line-height:1;letter-spacing:.06em;background:linear-gradient(100deg,var(--neon),var(--neon2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);font-size:14px;margin-top:8px;line-height:1.45}
.daily{margin:0 14px 16px;border-radius:var(--r);padding:16px;background:linear-gradient(135deg,#2A1B4D,#3A1B45);border:1px solid #4A2E6E;display:flex;align-items:center;gap:14px;transition:transform .1s}
.daily:active{transform:scale(.985)}
.daily .n{font-size:32px;font-weight:800;line-height:1;color:var(--gold)}
.daily .t{flex:1;text-align:left}
.daily .t b{display:block;font-size:15px}
.daily .t small{color:#C9B8E8;font-size:12.5px}
.daily .go{font-size:20px;color:var(--gold)}
.menu{display:flex;flex-direction:column;gap:10px;padding:0 14px}
.mi{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:left;transition:transform .1s,border-color .15s}
.mi:active{transform:scale(.985)}
.mi .g{width:52px;height:52px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:26px}
.mi .b{flex:1;min-width:0}
.mi .b b{display:block;font-size:16px;margin-bottom:5px}
.mi .pb{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.mi .pb i{display:block;height:100%;border-radius:3px;transition:width .4s}
.mi .pc{font-size:12px;color:var(--dim);margin-top:5px;display:block}
.mi.lock{opacity:.55}

/* ---------- section menu ---------- */
.cards{display:flex;flex-direction:column;gap:10px;padding:4px 14px}
.big-card{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:left;transition:transform .1s}
.big-card:active{transform:scale(.985)}
.big-card .em{font-size:24px;width:46px;height:46px;flex:none;border-radius:14px;background:var(--panel2);display:grid;place-items:center}
.big-card b{display:block;font-size:15.5px}
.big-card small{color:var(--dim);font-size:12.5px;display:block;margin-top:2px;line-height:1.35}

/* ---------- stage ---------- */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 16px;min-height:0}
.card{width:min(74vw,290px);aspect-ratio:1;border-radius:30px;background:var(--panel);display:grid;place-items:center;position:relative;
  box-shadow:0 0 0 1px var(--line),0 20px 60px -30px var(--neon);transition:box-shadow .18s,transform .12s}
.card .big{font-size:clamp(88px,36vw,140px);line-height:1;transition:transform .14s}
.card .big.lat{font-size:clamp(64px,24vw,104px);font-weight:800;letter-spacing:.03em;color:var(--neon2)}
.card.ok{box-shadow:0 0 0 2px var(--ok),0 0 90px -25px var(--ok)}
.card.ko{box-shadow:0 0 0 2px var(--ko),0 0 90px -25px var(--ko);animation:sh .32s}
.card.ok .big{transform:scale(1.07)}
@keyframes sh{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
.card .rom{position:absolute;bottom:16px;font-size:23px;font-weight:700;color:var(--neon2);opacity:0;transition:opacity .15s}
.card .rom.kb{font-size:42px;color:var(--ink);font-weight:400}
.card.rev .rom{opacity:1}
.hint{margin-top:14px;color:var(--dim);font-size:13.5px;text-align:center;min-height:19px;padding:0 20px;line-height:1.4}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:6px 14px 12px}
.ans{padding:17px 0;border-radius:16px;background:var(--panel);font-size:23px;font-weight:700;letter-spacing:.05em;transition:background .12s,transform .1s,opacity .12s;line-height:1.1;border:1px solid var(--line)}
.ans.k{font-size:34px;font-weight:400;letter-spacing:0;padding:13px 0}
.ans:active{transform:scale(.96)}
.ans.ok{background:var(--ok);color:#06251A;border-color:var(--ok)}
.ans.ko{background:var(--ko);color:#fff;border-color:var(--ko)}
.ans.dim{opacity:.3}
.nav{display:flex;gap:9px;padding:6px 14px 12px}
.btn{flex:1;padding:15px;border-radius:16px;background:var(--panel);font-size:15.5px;font-weight:600;border:1px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--neon);color:#fff;border-color:var(--neon)}
.btn.g{background:transparent;color:var(--dim)}

/* écrire */
.wbox{position:relative;width:min(78vw,300px);aspect-ratio:1;border-radius:26px;background:var(--panel);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.wbox::before,.wbox::after{content:"";position:absolute;background:var(--line);opacity:.55}
.wbox::before{left:50%;top:6%;bottom:6%;width:1px;transform:translateX(-.5px)}
.wbox::after{top:50%;left:6%;right:6%;height:1px;transform:translateY(-.5px)}
.wmodel{position:absolute;inset:0;display:grid;place-items:center;font-size:min(58vw,220px);line-height:1;color:var(--ink);opacity:.18;pointer-events:none;transition:opacity .2s}
.wrom{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:15px;font-weight:700;color:var(--neon2);pointer-events:none}
#pad{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

/* timer */
.tw{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .4s}
.tw.on{opacity:1;box-shadow:inset 0 0 60px -10px var(--ko);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 40px -14px var(--ko)}50%{box-shadow:inset 0 0 90px 0 var(--ko)}}
.clock{font-variant-numeric:tabular-nums;font-weight:700}
.clock.warn{color:var(--ko)}

/* ---------- grid / progression ---------- */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.grid.num{grid-template-columns:repeat(4,1fr)}
.hdr{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:5px}
.hdr button{padding:7px 0;border-radius:9px;background:var(--panel);font-size:11.5px;color:var(--dim);font-weight:600;border:1px solid var(--line)}
.hdr button.on{background:var(--neon);color:#fff;border-color:var(--neon)}
.gwrap{display:grid;grid-template-columns:30px 1fr;gap:5px;align-items:start}
.rlab{display:grid;gap:5px}
.rlab button{aspect-ratio:1;border-radius:9px;background:var(--panel);font-size:11.5px;color:var(--dim);font-weight:600;border:1px solid var(--line);display:grid;place-items:center}
.rlab button.on{background:var(--neon);color:#fff;border-color:var(--neon)}
.cell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:25px;background:var(--panel);position:relative;border:1.5px solid transparent;transition:transform .1s,border-color .2s,background .2s}
.cell:active{transform:scale(.93)}
.cell small{position:absolute;bottom:2px;right:4px;font-size:8.5px;color:var(--dim);font-family:-apple-system,system-ui}
.cell em{position:absolute;top:2px;left:5px;font-size:9px;font-style:normal;font-weight:700;font-family:-apple-system,system-ui;opacity:.85}
.cell.n0{border-color:var(--line);color:#6B7095}
.cell.n1{background:#33192A;border-color:var(--ko)}.cell.n1 em{color:var(--ko)}
.cell.n2{background:#332B15;border-color:var(--gold)}.cell.n2 em{color:var(--gold)}
.cell.n3{background:#153229;border-color:#1FA97A}.cell.n3 em{color:var(--ok)}
.cell.n4{background:#12352A;border-color:var(--ok);box-shadow:0 0 16px -6px var(--ok)}.cell.n4 em{color:var(--ok)}
.cell.empty{background:transparent;border:0}
.cell.sel{outline:2px solid var(--cyan);outline-offset:-2px}
.cell.gold{background:linear-gradient(135deg,#4A3A12,#6B5220);border-color:var(--gold);color:#FFE9A8}
.cell.rb{animation:rb 4s linear infinite}
@keyframes rb{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:11.5px;color:var(--dim);padding:10px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.qbtns{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.qb{padding:9px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--dim)}
.qb.on{background:var(--neon2);border-color:var(--neon2);color:#fff;font-weight:600}

/* ---------- memory / liaison ---------- */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;align-content:center;flex:1;padding:8px 0}
.mc{aspect-ratio:3/4;border-radius:14px;background:var(--panel);display:grid;place-items:center;font-size:28px;border:1.5px solid var(--line);position:relative;transition:transform .14s,background .18s;perspective:600px}
.mc span{opacity:0;transition:opacity .12s}
.mc.up{background:var(--panel2);border-color:var(--neon)}
.mc.up span{opacity:1}
.mc.lat span{font-size:20px;font-weight:700;color:var(--neon2)}
.mc.done{background:#12352A;border-color:var(--ok);pointer-events:none}
.mc.done span{opacity:.85}
.mc.bad{border-color:var(--ko);animation:sh .3s}
.mc:active{transform:scale(.95)}
.link{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px;align-content:center;position:relative}
.lcol{display:flex;flex-direction:column;gap:9px}
.li{padding:15px 6px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);font-size:26px;text-align:center;transition:transform .1s,border-color .15s,background .15s}
.li.lat{font-size:19px;font-weight:700;color:var(--neon2)}
.li.sel{border-color:var(--cyan);background:var(--panel2)}
.li.done{background:#12352A;border-color:var(--ok);opacity:.75;pointer-events:none}
.li.bad{border-color:var(--ko);animation:sh .3s}
.li:active{transform:scale(.97)}

/* ---------- end / toast / confetti ---------- */
.end{text-align:center;padding:26px 20px}
.end .sc{font-size:60px;font-weight:800;color:var(--ok);line-height:1}
.end p{color:var(--dim);margin:10px 0 22px;line-height:1.55;font-size:14px}
.rec{color:var(--gold);font-weight:700}
.toast{position:fixed;left:14px;right:14px;top:calc(8px + env(safe-area-inset-top));background:linear-gradient(135deg,#2A1B4D,#3A1B45);border:1px solid #5A3A8E;border-radius:16px;padding:11px 14px;z-index:20;
  transform:translateY(calc(-100% - 30px));transition:transform .34s cubic-bezier(.2,.9,.3,1);text-align:center;box-shadow:0 12px 40px -12px #000}
.toast.on{transform:none}
.toast b{font-size:14px}
.toast b{display:block;font-size:15px;margin-bottom:3px}
.toast small{color:#C9B8E8;font-size:12.5px}
#cfx{position:fixed;inset:0;pointer-events:none;z-index:30}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(6,8,16,.7);display:none;align-items:flex-end;z-index:40;backdrop-filter:blur(3px)}
.sheet.open{display:flex}
.sheet>div{width:100%;max-height:88vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h2{font-size:15px;margin:16px 0 7px}
.sheet h2:first-of-type{margin-top:0}
.sheet p{color:var(--dim);font-size:12.5px;margin-bottom:10px;line-height:1.45}
.seg{display:flex;background:var(--panel);border-radius:13px;padding:4px;gap:3px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font-size:12.5px;color:var(--dim)}
.seg button.on{background:var(--line);color:var(--ink);font-weight:600}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--panel);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-size:14.5px;text-align:left}
.tog small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;line-height:1.35}
.sw{width:44px;height:26px;flex:none;border-radius:13px;background:var(--line);position:relative;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s}
.tog.on .sw{background:var(--neon)}
.tog.on .sw::after{left:21px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div class="hd" id="hd">
    <button class="ic hidden" id="backBtn">‹</button>
    <h1 id="title">Kana<small id="stitle">Hiragana · Katakana · Chiffres</small></h1>
    <button class="ic" id="setBtn">⚙︎</button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="sub"><span id="subL"></span><span id="subR"></span></div>
  <div id="view" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</div>
<div class="tw" id="tw"></div>
<canvas id="cfx"></canvas>
<div class="toast" id="toast"><b id="tt"></b><small id="ts"></small></div>

<div class="sheet" id="sheet"><div>
  <div class="grab"></div>
  <h2>Sens de lecture</h2>
  <div class="seg" id="segDir">
    <button data-v="k2r">Kana → son</button><button data-v="r2k">Son → kana</button>
  </div>
  <h2>Difficulté</h2>
  <button class="tog" id="togHard"><div>Mode difficile<small>Les mauvaises réponses ressemblent à la bonne. Force le sens son → kana.</small></div><div class="sw"></div></button>
  <h2>Run</h2>
  <div class="seg" id="segRun">
    <button data-v="normal">Normal</button><button data-v="survie">Survie</button><button data-v="parfait">Sans faute</button>
  </div>
  <p style="margin-top:8px">Normal : une passe, les erreurs comptent. Survie : l'erreur revient plus tard. Sans faute : l'erreur relance tout.</p>
  <h2>Contre-la-montre</h2>
  <div class="seg" id="segTime"><button data-v="15">15 s</button><button data-v="20">20 s</button><button data-v="30">30 s</button><button data-v="45">45 s</button><button data-v="60">60 s</button></div>
  <h2>Memory</h2>
  <div class="seg" id="segMem"><button data-v="4">4</button><button data-v="6">6</button><button data-v="8">8</button><button data-v="10">10 paires</button></div>
  <h2>Confort</h2>
  <button class="tog" id="togFx"><div>Effets visuels<small>Confettis, pulsations, couleurs débloquées</small></div><div class="sw"></div></button>
  <button class="tog" id="togVib"><div>Vibrations</div><div class="sw"></div></button>
  <h2>Données</h2>
  <div class="nav" style="padding:0 0 8px"><button class="btn" id="expBtn">Exporter</button><button class="btn" id="impBtn">Importer</button></div>
  <button class="btn g" id="rstBtn" style="width:100%">Effacer toute la progression</button>
  <button class="btn p" id="closeSheet" style="width:100%;margin-top:14px">Fermer</button>
</div></div>

<script>
"use strict";
/* ══════════ DONNÉES ══════════ */
const V=['a','i','u','e','o'];
const H_ROWS=[['',['あ','い','う','え','お']],['k',['か','き','く','け','こ']],['s',['さ','し','す','せ','そ']],
['t',['た','ち','つ','て','と']],['n',['な','に','ぬ','ね','の']],['h',['は','ひ','ふ','へ','ほ']],
['m',['ま','み','む','め','も']],['y',['や',null,'ゆ',null,'よ']],['r',['ら','り','る','れ','ろ']],['w',['わ',null,null,null,'を']]];
const K_ROWS=[['',['ア','イ','ウ','エ','オ']],['k',['カ','キ','ク','ケ','コ']],['s',['サ','シ','ス','セ','ソ']],
['t',['タ','チ','ツ','テ','ト']],['n',['ナ','ニ','ヌ','ネ','ノ']],['h',['ハ','ヒ','フ','ヘ','ホ']],
['m',['マ','ミ','ム','メ','モ']],['y',['ヤ',null,'ユ',null,'ヨ']],['r',['ラ','リ','ル','レ','ロ']],['w',['ワ',null,null,null,'ヲ']]];
const SP={'し':'shi','ち':'chi','つ':'tsu','ふ':'fu','を':'o (wo)','シ':'shi','チ':'chi','ツ':'tsu','フ':'fu','ヲ':'o (wo)'};
const NUMS=[['一','ichi',1],['二','ni',2],['三','san',3],['四','yon / shi',4],['五','go',5],['六','roku',6],['七','nana / shichi',7],
['八','hachi',8],['九','kyuu / ku',9],['十','juu',10],['百','hyaku',100],['千','sen',1000]];
const LOOK={'あ':'おめぬ','い':'りこに','う':'つらろ','え':'んれわ','お':'あむす','か':'やせが','き':'さちま','く':'へしつ','け':'はほに','こ':'いにた',
'さ':'きちせ','し':'つくひ','す':'むぬお','せ':'けさほ','そ':'てろる','た':'なにこ','ち':'さきら','つ':'しうく','て':'とそひ','と':'てむよ',
'な':'たにね','に':'こけた','ぬ':'めあね','ね':'れわぬ','の':'めぬあ','は':'ほけま','ひ':'てしそ','ふ':'らそう','へ':'くしつ','ほ':'はけま',
'ま':'よほむ','み':'ふまよ','む':'すまも','め':'ぬあの','も':'まむし','や':'かせゆ','ゆ':'よぬわ','よ':'まみゆ','ら':'うろふ','り':'いこけ',
'る':'ろそふ','れ':'ねわえ','ろ':'るらそ','わ':'れねゆ','を':'せむも','ん':'えれそ',
'ア':'マヤワ','イ':'ィリノ','ウ':'ワクフ','エ':'ユコロ','オ':'ホヤナ','カ':'ガキタ','キ':'サチカ','ク':'クケタ','ケ':'クタケ','コ':'ユニロ',
'サ':'セキナ','シ':'ツソン','ス':'ヌマス','セ':'サヒヤ','ソ':'ンシリ','タ':'クケナ','チ':'テキサ','ツ':'シソン','テ':'チラテ','ト':'イⅠト',
'ナ':'メオナ','ニ':'ココエ','ヌ':'メスヲ','ネ':'ホウネ','ノ':'メソリ','ハ':'ヘノハ','ヒ':'トヒヒ','フ':'ワウス','ヘ':'ハヘヘ','ホ':'木ネオ',
'マ':'ムアヤ','ミ':'ハミミ','ム':'マメム','メ':'ノヌメ','モ':'セモモ','ヤ':'セヤア','ユ':'エコユ','ヨ':'ヲユヨ','ラ':'テウフ','リ':'ソノリ',
'ル':'レリル','レ':'ノレル','ロ':'コエロ','ワ':'ウクフ','ヲ':'フラヲ','ン':'ソシツ'};
const ROWLAB={v:'ア',k:'K',s:'S',t:'T',n:'N',h:'H',m:'M',y:'Y',r:'R',w:'W',nn:'ん'};

function build(rows,extra,pre){
  const a=[];
  rows.forEach(([c,arr])=>arr.forEach((k,i)=>{ if(k) a.push({c:k,r:SP[k]||(c+V[i]),row:c||'v',vowel:V[i],set:pre}); }));
  if(extra) a.push({c:extra,r:'n',row:'nn',vowel:'x',set:pre});
  return a;
}
const SETS={
  hira:{id:'hira',name:'Hiragana',jp:'ひらがな',rows:H_ROWS,items:build(H_ROWS,'ん','hira'),grid:5,color:'var(--neon)'},
  kata:{id:'kata',name:'Katakana',jp:'カタカナ',rows:K_ROWS,items:build(K_ROWS,'ン','kata'),grid:5,color:'var(--neon2)'},
  num :{id:'num',name:'Chiffres',jp:'すうじ',rows:null,items:NUMS.map(([c,r,v])=>({c,r,row:'num',vowel:'x',set:'num',val:v})),grid:4,color:'var(--cyan)'}
};

/* ══════════ ÉTAT ══════════ */
let S={ stats:{}, best:{}, opt:{dir:'k2r',hard:false,run:'normal',mem:6,fx:true,vib:true,time:20}, ach:{}, seen:0 };

/* ══════════ STOCKAGE ══════════ */
const KEY='kana-v3';
function load(){ try{ const v=localStorage.getItem(KEY); if(v){ const d=JSON.parse(v);
  S.stats=d.stats||{}; S.best=d.best||{}; S.ach=d.ach||{}; S.opt=Object.assign(S.opt,d.opt||{}); } }catch(e){}
  try{ const o=localStorage.getItem('hiragana-v2'); if(o&&!Object.keys(S.stats).length){ const d=JSON.parse(o);
    Object.entries(d.stats||{}).forEach(([k,st])=>{ S.stats['hira'+k]={f:Math.max(0,Math.min(100,(st.score||0)*5)),s:0,w:0,t:Date.now()}; }); save(); } }catch(e){}
  decay();
}
let sT; function save(){ clearTimeout(sT); sT=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify({stats:S.stats,best:S.best,ach:S.ach,opt:S.opt})); }catch(e){} },250); }
function decay(){ const now=Date.now(),D=864e5;
  Object.values(S.stats).forEach(st=>{ if(!st.t) return; const d=Math.floor((now-st.t)/D); if(d>2){ st.f=Math.max(0,st.f-(d-2)); st.t=now-2*D; } }); }

/* ══════════ FORCE ══════════ */
function K(x){ return x.set+x.c; }
function stat(x){ const k=K(x); return S.stats[k]||(S.stats[k]={f:0,s:0,w:0,t:0}); }
function lvl(x){ const st=S.stats[K(x)]; if(!st||!st.t) return 0; if(st.f>=100) return 4; if(st.f>=71) return 3; if(st.f>=31) return 2; return 1; }
function mark(x,ok){
  const st=stat(x), before=st.f;
  if(ok){ st.s++; st.w=0; st.f=Math.min(100, st.f + 5 + Math.min(5, Math.floor(st.s/3))); }
  else { st.f=Math.max(0, st.f - (st.w>0?22:12)); st.s=0; st.w++; }
  st.t=Date.now(); save();
  if(ok && before<100 && st.f>=100) checkAch(x);
}
const pct=id=>{ const it=SETS[id].items; return Math.round(it.reduce((a,x)=>a+(S.stats[K(x)]?S.stats[K(x)].f:0),0)/(it.length*100)*100); };
const done=id=>SETS[id].items.filter(x=>lvl(x)===4).length;

/* ══════════ SUCCÈS ══════════ */
function checkAch(x){
  const set=SETS[x.set];
  if(x.set!=='num'){
    const col=set.items.filter(y=>y.vowel===x.vowel);
    if(col.length>1 && col.every(y=>lvl(y)===4) && !S.ach[x.set+'c'+x.vowel]){
      S.ach[x.set+'c'+x.vowel]=1; save(); celebrate('Colonne '+x.vowel.toUpperCase()+' maîtrisée','Elle passe en doré'); return; }
    const row=set.items.filter(y=>y.row===x.row);
    if(row.length>1 && row.every(y=>lvl(y)===4) && !S.ach[x.set+'r'+x.row]){
      S.ach[x.set+'r'+x.row]=1; save(); celebrate('Ligne '+ROWLAB[x.row]+' maîtrisée','Elle passe en doré'); return; }
  }
  if(set.items.every(y=>lvl(y)===4) && !S.ach[x.set+'all']){
    S.ach[x.set+'all']=1; save(); celebrate(set.name+' au complet','Mode arc-en-ciel débloqué'); return; }
  celebrate(x.c+' maîtrisé','100 / 100');
}
let tT;
function celebrate(t,s){ $('tt').textContent=t; $('ts').textContent=s; $('toast').classList.add('on'); confetti();
  clearTimeout(tT); tT=setTimeout(()=>$('toast').classList.remove('on'),3000); vib([12,50,12]); }

/* ══════════ CONFETTIS ══════════ */
const cvs=document.getElementById('cfx'), ctx=cvs.getContext('2d'); let parts=[],raf=null;
function resize(){ cvs.width=innerWidth*devicePixelRatio; cvs.height=innerHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize',resize); resize();
function confetti(){
  if(!S.opt.fx) return;
  const cols=['#9B5CFF','#FF4FD8','#4DE8FF','#3DFFB0','#FFD166'];
  for(let i=0;i<70;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,
    vx:(Math.random()-.5)*9,vy:-Math.random()*13-4,g:.32,s:Math.random()*6+3,c:cols[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.3,l:1});
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>{ p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.008;
    if(p.y>innerHeight+30||p.l<=0) return false;
    ctx.save();ctx.globalAlpha=Math.max(0,p.l);ctx.translate(p.x,p.y);ctx.rotate(p.r);
    ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore(); return true; });
  if(parts.length) raf=requestAnimationFrame(tick); else { raf=null; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ══════════ ACCUEIL ══════════ */
function dueList(){
  const all=[...SETS.hira.items,...SETS.kata.items,...SETS.num.items];
  const seen=all.filter(x=>{ const st=S.stats[K(x)]; return st&&st.t&&st.f<100; })
                .sort((a,b)=>(S.stats[K(a)].f-S.stats[K(b)].f));
  if(seen.length>=8) return seen.slice(0,15);
  const never=all.filter(x=>!S.stats[K(x)]||!S.stats[K(x)].t);
  return seen.concat(sh(never).slice(0,15-seen.length));
}

function drawGrid(hostId,selectable,onCh){
  const s=SETS[cur], host=$(hostId);
  if(cur==='num'){
    host.innerHTML=`<div class="grid num" id="gr"></div>`;

    <div><div class="hdr" id="hd2"></div><div class="grid" id="gr"></div></div></div>`;
  const hd=$('hd2');

    const col=s.items.filter(x=>x.vowel===v); b.className=col.every(x=>sel.has(x.c))&&sel.size?'on':'';
    if(selectable) b.onclick=()=>{ const all=col.every(x=>sel.has(x.c)); col.forEach(x=>all?sel.delete(x.c):sel.add(x.c)); drawGrid(hostId,selectable,onCh); onCh&&onCh(); };
    hd.appendChild(b); });
  const rl=$('rl');
  s.rows.forEach(([c])=>{ const key=c||'v'; const b=document.createElement('button'); b.textContent=ROWLAB[key];
    const row=s.items.filter(x=>x.row===key); b.className=row.length&&row.every(x=>sel.has(x.c))&&sel.size?'on':'';
    if(selectable) b.onclick=()=>{ const all=row.every(x=>sel.has(x.c)); row.forEach(x=>all?sel.delete(x.c):sel.add(x.c)); drawGrid(hostId,selectable,onCh); onCh&&onCh(); };
    rl.appendChild(b); });
  const extra=s.items.find(x=>x.row==='nn');
  if(extra){ const b=document.createElement('button'); b.className='kana'+(sel.has(extra.c)?' on':''); b.textContent=extra.c;
    if(selectable) b.onclick=()=>{ sel.has(extra.c)?sel.delete(extra.c):sel.add(extra.c); drawGrid(hostId,selectable,onCh); onCh&&onCh(); };
    rl.appendChild(b); }
  const g=$('gr');
  s.rows.forEach(([c,arr])=>arr.forEach(k=>{
    if(!k){ const d=document.createElement('div'); d.className='cell empty'; g.appendChild(d); return; }
    g.appendChild(cellEl(BY[cur+k],selectable,onCh));
  }));
}
function cellEl(x,selectable,onCh){
  const st=S.stats[K(x)], L=lvl(x), d=document.createElement('div');
  const goldCol=S.ach[x.set+'c'+x.vowel], goldRow=S.ach[x.set+'r'+x.row], all=S.ach[x.set+'all'];
  d.className='cell kana n'+L+(sel.has(x.c)?' sel':'')+(S.opt.fx&&(goldCol||goldRow)&&L===4?' gold':'')+(S.opt.fx&&all&&L===4?' rb':'');
  d.innerHTML=`${x.c}<small>${x.r.split(' ')[0]}</small>`+(st&&st.t?`<em>${st.f}</em>`:'');
  if(selectable) d.onclick=()=>{ sel.has(x.c)?sel.delete(x.c):sel.add(x.c); d.classList.toggle('sel'); onCh&&onCh(); };
  return d;
}

/* ══════════ MOTEUR QCM ══════════ */
function distract(x,p){
  let c=[];
  if(S.opt.hard){ c=[...(LOOK[x.c]||'')].filter(ch=>ch!==x.c&&BY[cur+ch]).map(ch=>BY[cur+ch]); }
  c=c.concat(sh(p.filter(y=>y.c!==x.c&&!c.includes(y))));
  if(c.length<3) c=c.concat(sh(SETS[cur].items.filter(y=>y.c!==x.c&&!c.includes(y))));
  const o=[]; for(const y of c){ if(!o.includes(y)) o.push(y); if(o.length===3) break; } return o;
}
function showQ(x){ const b=$('big'),r=$('rom');
  if(isK2R()){ b.textContent=x.c; b.className='big kana'; r.textContent=x.r; r.className='rom'; }
  else { b.textContent=x.r; b.className='big lat'; r.textContent=x.c; r.className='rom kana kb'; }
  $('card').className='card'; }
function answers(x,cb){
  const box=$('answers'); box.innerHTML='';
  sh([x,...distract(x,pool())]).forEach(o=>{ const b=document.createElement('button');
    b.className='ans'+(isK2R()?'':' k'); b.textContent=isK2R()?o.r:o.c; b.dataset.c=o.c;
    b.onclick=()=>cb(o,b); box.appendChild(b); });
}
function flash(ok,btn,x){
  [...$('answers').children].forEach(b=>{ if(b.dataset.c===x.c) b.classList.add('ok'); else b.classList.add('dim'); });
  if(!ok){ btn.classList.remove('dim'); btn.classList.add('ko'); }
  $('card').classList.add(ok?'ok':'ko','rev'); vib(ok?15:[35,40,35]);
}
function stageHTML(){ return `<div class="stage"><div class="card" id="card"><div class="big kana" id="big"></div><div class="rom" id="rom"></div></div><div class="hint" id="hint"></div></div><div class="answers" id="answers"></div>`; }

/* ══════════ QUIZ ══════════ */
function quiz(){
  head('Quiz',SETS[cur].name,true); $('view').innerHTML=stageHTML();
  let curX=null,lock=false,streak=0,bk='q:'+selKey(),bag=[],prev=[];
  const refill=()=>{ const p=pool(); bag=[];
    p.forEach(x=>{ const L=lvl(x), n=(L===0?3:L===1?3:L===2?2:1); for(let i=0;i<n;i++) bag.push(x); });
    bag=sh(bag);
    if(bag.length>1 && prev.length && bag[0].c===prev[prev.length-1].c) bag.push(bag.shift()); };
  const nextQ=()=>{
    const p=pool(); if(!p.length) return;
    if(!bag.length) refill();
    let i=0; if(p.length>2){ while(i<bag.length-1 && prev.slice(-Math.min(2,p.length-1)).some(y=>y.c===bag[i].c)) i++; }
    curX=bag.splice(i,1)[0];
    prev.push(curX); if(prev.length>3) prev.shift();
    lock=false; showQ(curX); $('hint').textContent='';
    info(`Série <b class="streak">${streak}</b> · record ${S.best[bk]||0}${flags()}`,`Force ${S.stats[K(curX)]?S.stats[K(curX)].f:0}/100`);
    setBar(pct(cur)/100);
    answers(curX,(o,b)=>{ if(lock)return; lock=true;
      const ok=o.c===curX.c; mark(curX,ok);
      if(ok){ streak++; if(streak>(S.best[bk]||0)){S.best[bk]=streak;save();} } else streak=0;
      flash(ok,b,curX); setTimeout(nextQ,ok?420:1050); });
  };
  nextQ();
}

function run(){

  const p=pool(), bk='r:'+selKey()+':'+S.opt.run+(S.opt.hard?':h':'');
  $('view').innerHTML=stageHTML()+`<div class="nav"><button class="btn p" id="st">Lancer · ${p.length} caractères</button></div>`;
  $('big').textContent='走'; $('rom').textContent='';
  $('hint').textContent={normal:'Une passe complète.',survie:"L'erreur revient plus plus tard.",parfait:'Une erreur relance tout.'}[S.opt.run];
  info('<b>Run</b>'+flags(), S.best[bk]?`record <b>${fmt(S.best[bk])}</b>`:'aucun record');
  setBar(0);
  $('st').onclick=start;
  function start(){
    let q=sh(pool()),tot=q.length,d=0,err=0,stk=0,t0=Date.now(),lock=false,x=null;
    $('view').innerHTML=stageHTML();
    clearInterval(G.tick);
    G.tick=setInterval(()=>info(`<b>${d}</b> / ${tot} · série <b class="streak">${stk}</b>${flags()}`,
      `fautes ${err} · <b class="clock">${fmt(Math.round((Date.now()-t0)/1000))}</b>`),400);
    const nx=()=>{
      if(!q.length){ fin(); return; }
      x=q.shift(); lock=false; showQ(x); $('hint').textContent=''; setBar(d/tot);
      answers(x,(o,b)=>{ if(lock)return; lock=true;
        const ok=o.c===x.c; mark(x,ok);
        if(ok){d++;stk++;} else {err++;stk=0;}
        flash(ok,b,x);
        if(ok){ setTimeout(nx,420); return; }
        if(S.opt.run==='parfait'){ setTimeout(()=>{$('hint').textContent='Raté. On repart.';setTimeout(start,650);},850); }
        else if(S.opt.run==='survie'){ q.splice(Math.min(q.length,3+(Math.random()*4|0)),0,x); setTimeout(nx,1050); }
        else { d++; setTimeout(nx,1050); }
      });
    };
    const fin=()=>{ clearInterval(G.tick);
      const sec=Math.round((Date.now()-t0)/1000); let rec=false;
      if(err===0){ if(!S.best[bk]||sec<S.best[bk]){S.best[bk]=sec;rec=true;save();} }
      if(err===0) confetti();
      $('view').innerHTML=`<div class="end"><div class="sc">${tot}</div>
        <p>${tot} caractères · ${err} faute${err>1?'s':''} · ${fmt(sec)}<br>
        ${err===0?(rec?'<span class="rec">Nouveau record.</span>':'Sans faute. Record : '+fmt(S.best[bk])):'Le chrono ne compte qu\'à zéro faute.'}</p>
        <button class="btn p" id="ag" style="width:100%">Relancer</button>
        <button class="btn g" id="bk2" style="width:100%;margin-top:9px">Retour</button></div>`;
      info('',''); setBar(1); $('ag').onclick=start; $('bk2').onclick=back; };
    nx();
  }
}

/* ══════════ CONTRE-LA-MONTRE ══════════ */
function rush(){
  head('Contre-la-montre',SETS[cur].name,true);
  const T=(S.opt.time||20), bk='t:'+selKey()+':'+T;
  $('view').innerHTML=stageHTML()+`<div class="nav"><button class="btn p" id="st">Démarrer · ${T} s</button></div>`;
  $('big').textContent='⏱'; $('big').className='big'; $('rom').textContent='';
  $('hint').textContent='Chaque bonne réponse ajoute 2 s, chaque erreur en retire 5.';
  info('<b>Chrono</b>'+flags(), S.best[bk]?`record <b>${S.best[bk]} pts</b>`:'aucun record'); setBar(0);
  $('st').onclick=start;
  function start(){
    let time=T*1000,score=0,stk=0,lock=false,x=null,last=Date.now();
    $('view').innerHTML=stageHTML();
    clearInterval(G.tick);
    G.tick=setInterval(()=>{
      const now=Date.now(); time-=now-last; last=now;
      if(time<=0){ time=0; fin(); return; }
      const s=time/1000, warn=s<=5;
      info(`<b>${score}</b> pts · série <b class="streak">${stk}</b>`,`<b class="clock${warn?' warn':''}">${s.toFixed(1)}s</b>`);
      setBar(time/(T*1000));
      $('tw').classList.toggle('on',warn&&S.opt.fx);
    },80);
    const nx=()=>{
      const p=pool(); x=p[Math.random()*p.length|0]; lock=false; showQ(x); $('hint').textContent='';
      answers(x,(o,b)=>{ if(lock)return; lock=true;
        const ok=o.c===x.c; mark(x,ok);
        if(ok){ score++; stk++; time+=2000; } else { stk=0; time=Math.max(300,time-5000); }
        flash(ok,b,x); setTimeout(nx,ok?260:520); });
    };
    const fin=()=>{ clearInterval(G.tick); $('tw').classList.remove('on');
      let rec=false; if(score>(S.best[bk]||0)){S.best[bk]=score;rec=true;save();confetti();}
      $('view').innerHTML=`<div class="end"><div class="sc">${score}</div>
        <p>bonnes réponses avant la fin du temps<br>${rec?'<span class="rec">Nouveau record.</span>':'Record : '+(S.best[bk]||0)+' pts'}</p>
        <button class="btn p" id="ag" style="width:100%">Rejouer</button>
        <button class="btn g" id="bk2" style="width:100%;margin-top:9px">Retour</button></div>`;
      info('',''); setBar(0); $('ag').onclick=start; $('bk2').onclick=back; };
    nx();
  }
}

/* ══════════ MEMORY ══════════ */
function memory(){
  head('Memory',SETS[cur].name,true);
  const n=Math.min(S.opt.mem,pool().length), bk='m:'+selKey()+':'+n;
  $('view').innerHTML=`<div class="scroll" style="display:flex;flex-direction:column"><div class="memgrid" id="mg"></div></div><div class="nav"><button class="btn p" id="st">Nouvelle partie · ${n} paires</button></div>`;
  info(`<b>Memory</b> · ${n} paires`, S.best[bk]?`record <b>${fmt(S.best[bk])}</b>`:'entraînement libre'); setBar(0);
  $('st').onclick=start;
  function start(){
    const chosen=sh(pool()).slice(0,n);
    const cards=sh(chosen.flatMap(x=>[{x,f:'c'},{x,f:'r'}]));
    let up=[],lock=false,mv=0,dn=0,t0=Date.now();
    const g=$('mg'); g.innerHTML='';
    cards.forEach((c,i)=>{ const d=document.createElement('button');
      d.className='mc'+(c.f==='r'?' lat':' kana'); d.innerHTML=`<span>${c.f==='c'?c.x.c:c.x.r.split(' ')[0]}</span>`;
      d.onclick=()=>flip(i,d,c); g.appendChild(d); });
    $('st').textContent='Recommencer';
    clearInterval(G.tick);
    G.tick=setInterval(()=>info(`<b>${dn}</b> / ${n} paires`,`coups ${mv} · <b class="clock">${fmt(Math.round((Date.now()-t0)/1000))}</b>`),400);
    function flip(i,el,c){
      if(lock||el.classList.contains('up')||el.classList.contains('done'))return;
      el.classList.add('up'); up.push({el,c});
      if(up.length<2)return; lock=true; mv++;
      const [a,b]=up;
      if(a.c.x.c===b.c.x.c&&a.c.f!==b.c.f){ vib(15);
        setTimeout(()=>{ a.el.classList.add('done'); b.el.classList.add('done'); up=[];lock=false;dn++;
          setBar(dn/n); if(dn===n) fin(); },220);
      } else { vib([30,35,30]);
        a.el.classList.add('bad'); b.el.classList.add('bad');
        setTimeout(()=>{ [a,b].forEach(z=>z.el.classList.remove('up','bad')); up=[];lock=false; },720); }
    }
    function fin(){ clearInterval(G.tick); const sec=Math.round((Date.now()-t0)/1000);
      let rec=false; if(!S.best[bk]||sec<S.best[bk]){S.best[bk]=sec;rec=true;save();}
      confetti(); info(`<b>Terminé</b> · ${mv} coups`,(rec?'<span class="rec">record</span> ':'')+`<b>${fmt(sec)}</b>`); }
  }
  start();
}

/* ══════════ LIAISON ══════════ */
function liaison(){
  head('Liaison',SETS[cur].name,true);
  const per=5, bk='l:'+selKey();
  $('view').innerHTML=`<div class="link" id="lk"><div class="lcol" id="cL"></div><div class="lcol" id="cR"></div></div>
    <div class="hint" id="hint" style="padding-bottom:6px"></div><div class="nav"><button class="btn p" id="st">Commencer</button></div>`;
  info('<b>Liaison</b>','relie chaque son à son caractère'); setBar(0);
  $('st').onclick=start;
  function start(){
    const all=sh(pool()); let round=0,total=Math.ceil(all.length/per),errs=0,t0=Date.now(),pick=null;
    $('st').textContent='Recommencer';
    clearInterval(G.tick);
    G.tick=setInterval(()=>info(`Manche <b>${round+1}</b> / ${total}`,`fautes ${errs} · <b class="clock">${fmt(Math.round((Date.now()-t0)/1000))}</b>`),400);
    const deal=()=>{
      const grp=all.slice(round*per,round*per+per); if(!grp.length){ fin(); return; }
      let done=0; pick=null;
      const L=$('cL'),R=$('cR'); L.innerHTML='';R.innerHTML='';
      sh(grp).forEach(x=>{ const b=document.createElement('button'); b.className='li kana'; b.textContent=x.c; b.dataset.c=x.c;
        b.onclick=()=>tap(b,x,'c'); L.appendChild(b); });
      sh(grp).forEach(x=>{ const b=document.createElement('button'); b.className='li lat'; b.textContent=x.r.split(' ')[0]; b.dataset.c=x.c;
        b.onclick=()=>tap(b,x,'r'); R.appendChild(b); });
      setBar(round/total);
      function tap(el,x,side){
        if(el.classList.contains('done'))return;
        if(!pick){ pick={el,x,side}; el.classList.add('sel'); vib(8); return; }
        if(pick.el===el){ el.classList.remove('sel'); pick=null; return; }
        if(pick.side===side){ pick.el.classList.remove('sel'); pick={el,x,side}; el.classList.add('sel'); return; }
        const ok=pick.x.c===x.c; mark(x,ok);
        if(ok){ [pick.el,el].forEach(z=>{z.classList.remove('sel');z.classList.add('done');}); vib(15); done++;
          pick=null; if(done===grp.length){ round++; setTimeout(deal,380); } }
        else { errs++; const p2=pick; el.classList.add('bad'); p2.el.classList.add('bad'); vib([30,35,30]);
          setTimeout(()=>{ el.classList.remove('bad'); p2.el.classList.remove('bad','sel'); },600); pick=null; }
      }
    };
    const fin=()=>{ clearInterval(G.tick); const sec=Math.round((Date.now()-t0)/1000);
      let rec=false; if(errs===0&&(!S.best[bk]||sec<S.best[bk])){S.best[bk]=sec;rec=true;save();}
      confetti();
      $('view').innerHTML=`<div class="end"><div class="sc">${all.length}</div>
        <p>${total} manche${total>1?'s':''} · ${errs} faute${errs>1?'s':''} · ${fmt(sec)}<br>${rec?'<span class="rec">Nouveau record.</span>':(S.best[bk]?'Record sans faute : '+fmt(S.best[bk]):'')}</p>
        <button class="btn p" id="ag" style="width:100%">Rejouer</button>
        <button class="btn g" id="bk2" style="width:100%;margin-top:9px">Retour</button></div>`;
      info('',''); setBar(1); $('ag').onclick=()=>{go(liaison,false)}; $('bk2').onclick=back; };
    deal();
  }
}

/* ══════════ ÉCRIRE ══════════ */
function write(){
  head('Écrire',SETS[cur].name,true);
  const list=sh(pool()); let i=0,guide=true,drawing=false,strokes=0;
  $('view').innerHTML=`
   <div class="stage" style="justify-content:flex-start;padding-top:4px">
     <div class="wbox" id="wbox">
       <div class="wmodel kana" id="wmodel"></div>
       <canvas id="pad"></canvas>
       <div class="wrom" id="wrom"></div>
     </div>
     <div class="hint" id="hint">Trace le caractère par-dessus le modèle</div>
   </div>
   <div class="nav" style="padding-bottom:6px">
     <button class="btn" id="clr">Effacer</button>
     <button class="btn" id="gd">Masquer</button>
   </div>
   <div class="nav"><button class="btn" id="pv">←</button><button class="btn p" id="nx">Suivant →</button></div>`;
  const pad=$('pad'), c=pad.getContext('2d');
  const fit=()=>{ const r=pad.getBoundingClientRect(), d=devicePixelRatio||1;
    pad.width=r.width*d; pad.height=r.height*d; c.setTransform(d,0,0,d,0,0);
    c.lineWidth=11; c.lineCap='round'; c.lineJoin='round'; c.strokeStyle='#EEF0FF'; };
  setTimeout(fit,30);
  const pos=e=>{ const r=pad.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return [t.clientX-r.left,t.clientY-r.top]; };
  const start=e=>{ e.preventDefault(); drawing=true; strokes++; const [x,y]=pos(e); c.beginPath(); c.moveTo(x,y); c.lineTo(x+.1,y+.1); c.stroke(); upd(); };
  const move=e=>{ if(!drawing)return; e.preventDefault(); const [x,y]=pos(e); c.lineTo(x,y); c.stroke(); };
  const end=()=>{ drawing=false; };
  pad.addEventListener('touchstart',start,{passive:false}); pad.addEventListener('touchmove',move,{passive:false});
  pad.addEventListener('touchend',end); pad.addEventListener('touchcancel',end);
  pad.addEventListener('mousedown',start); pad.addEventListener('mousemove',move);
  addEventListener('mouseup',end);
  const clear=()=>{ c.clearRect(0,0,pad.width,pad.height); strokes=0; upd(); };
  const draw=()=>{ const x=list[i];
    $('wmodel').textContent=x.c; $('wmodel').style.opacity=guide?'.18':'0';
    $('wrom').textContent=x.r;
    clear(); info(`<b>${i+1}</b> / ${list.length}`,guide?'modèle affiché':'de mémoire');
    setBar((i+1)/list.length); };
  const upd=()=>{ $('hint').textContent=strokes?`${strokes} trait${strokes>1?'s':''} · compare avec le modèle`:'Trace le caractère par-dessus le modèle'; };
  $('clr').onclick=clear;
  $('gd').onclick=()=>{ guide=!guide; $('gd').textContent=guide?'Masquer':'Afficher'; $('wmodel').style.opacity=guide?'.18':'0';
    info(`<b>${i+1}</b> / ${list.length}`,guide?'modèle affiché':'de mémoire'); };
  $('nx').onclick=()=>{ i=(i+1)%list.length; draw(); };
  $('pv').onclick=()=>{ i=(i-1+list.length)%list.length; draw(); };
  draw();
}

/* ══════════ PROGRESSION ══════════ */
function progress(){
  const s=SETS[cur];
  head('Progression',s.name,true);
  info(`<b>${done(cur)}</b> / ${s.items.length} maîtrisés`,`force globale ${pct(cur)}%`); setBar(pct(cur)/100);
  $('view').innerHTML=`<div class="scroll" style="padding-top:6px">
    <div class="legend">
      <span><i style="background:var(--line)"></i>jamais vu</span>
      <span><i style="background:var(--ko)"></i>fragile · 1-30</span>
      <span><i style="background:var(--gold)"></i>en cours · 31-70</span>
      <span><i style="background:#1FA97A"></i>solide · 71-99</span>
      <span><i style="background:var(--ok)"></i>maîtrisé · 100</span>
    </div>
    <div id="gz"></div>
    <p style="color:var(--dim);font-size:12px;padding:12px 2px;line-height:1.5">
      Bonne réponse +5, jusqu'à +10 en série. Erreur −12, −22 si tu te trompes deux fois de suite.
      Sans révision, la force baisse de 1 par jour après 48 h : ce qui pâlit est ce qu'il faut revoir.</p>
  </div>`;
  const old=new Set(sel); sel=new Set(); drawGrid('gz',false); sel=old;
}

/* ══════════ RÉGLAGES ══════════ */
function syncSheet(){
  $('segDir').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.opt.dir));
  $('segRun').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.opt.run));
  $('segMem').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.opt.mem));
  $('segTime').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===(S.opt.time||20)));
  $('togHard').classList.toggle('on',S.opt.hard);
  $('togFx').classList.toggle('on',S.opt.fx);
  $('togVib').classList.toggle('on',S.opt.vib);
  $('segDir').style.opacity=S.opt.hard?.4:1; $('segDir').style.pointerEvents=S.opt.hard?'none':'auto';
}
$('setBtn').onclick=()=>{syncSheet();$('sheet').classList.add('open')};
$('closeSheet').onclick=()=>$('sheet').classList.remove('open');
$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').classList.remove('open')};
$('segDir').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.opt.dir=b.dataset.v;save();syncSheet()});
$('segRun').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.opt.run=b.dataset.v;save();syncSheet()});
$('segMem').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.opt.mem=+b.dataset.v;save();syncSheet()});
$('segTime').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.opt.time=+b.dataset.v;save();syncSheet()});
$('togHard').onclick=()=>{S.opt.hard=!S.opt.hard;save();syncSheet()};
$('togFx').onclick=()=>{S.opt.fx=!S.opt.fx;save();syncSheet()};
$('togVib').onclick=()=>{S.opt.vib=!S.opt.vib;save();syncSheet()};
$('expBtn').onclick=()=>{ const t=JSON.stringify({stats:S.stats,best:S.best,ach:S.ach,opt:S.opt});
  const ok=()=>alert('Progression copiée. Colle-la dans une note pour la conserver.');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,()=>prompt('Copie :',t)); else prompt('Copie :',t); };
$('impBtn').onclick=()=>{ const t=prompt('Colle ta progression :'); if(!t)return;
  try{ const d=JSON.parse(t); S.stats=d.stats||{};S.best=d.best||{};S.ach=d.ach||{};S.opt=Object.assign(S.opt,d.opt||{});save();alert('Restaurée.');$('sheet').classList.remove('open');nav=[];go(home); }catch(e){alert('Texte invalide.')} };
$('rstBtn').onclick=()=>{ if(confirm('Effacer force, records et succès ?')){ S.stats={};S.best={};S.ach={};save();$('sheet').classList.remove('open');nav=[];go(home); } };

/* ══════════ BOOT ══════════ */
load(); go(home);
</script>
</body>
